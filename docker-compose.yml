services:
  api:
    build:
      context: ./backend
    container_name: network-traffic-lab-api
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      SIM_DB_PATH: /app/data/simulator.db
      SIM_ALLOWED_TARGETS: ${SIM_ALLOWED_TARGETS:-}
      SIM_API_KEY: ${SIM_API_KEY:?Set SIM_API_KEY in your .env file}
    volumes:
      - simulator-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  simulator-data:
